<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestLens Security - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Centered Login Card using login-overlay class style -->
  <div class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <span class="logo-dot"></span>
        <h2>InvestLens</h2>
        <p>Please enter your credentials to access.</p>
      </div>
      <form id="login-form" class="login-form">
        <div class="login-input-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="name@company.com" required autocomplete="email">
        </div>
        <div class="login-input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit" id="btn-login" class="btn-primary" style="width: 100%; margin-top: 1rem;">
          <span class="btn-text">login</span>
          <div class="btn-loader"></div>
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>

</html>
